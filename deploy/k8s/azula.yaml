apiVersion: v1
kind: Namespace
metadata:
  name: azula
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: azula-config
  namespace: azula
data:
  API_PORT: "8080"
  WEB_URL: "http://azula.local"
  OLLAMA_BASE_URL: "http://ollama:11434"
  LLM_MODEL_A_PROVIDER: "ollama"
  LLM_MODEL_A_NAME: "qwen2.5:1.5b"
  LLM_MODEL_B_PROVIDER: "ollama"
  LLM_MODEL_B_NAME: "azula-incident"
  LLM_WORKER_SLOTS: "5"
  MCP_FILE_ROOT: "/data/uploads"
  SAMPLE_PIPELINE_DIR: "/app/samples/broken-pipeline"
  FREE_TIER_MAX_PROJECTS: "3"
  FREE_TIER_MAX_INVESTIGATIONS: "10"
  BILLING_DEMO: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: azula-secrets
  namespace: azula
type: Opaque
stringData:
  MONGODB_URI: "mongodb://azula-mongo:27017/azula"
  JWT_SECRET: "change-me"
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PRICE_ID: ""
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_REDIRECT_URL: "http://azula.local/auth/oidc/callback"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azula-mongo
  namespace: azula
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azula-mongo
  template:
    metadata:
      labels:
        app: azula-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: azula-mongo
  namespace: azula
spec:
  selector:
    app: azula-mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azula-api
  namespace: azula
spec:
  replicas: 2
  selector:
    matchLabels:
      app: azula-api
  template:
    metadata:
      labels:
        app: azula-api
    spec:
      containers:
        - name: api
          image: azula-api:local
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: azula-config
            - secretRef:
                name: azula-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: azula-api
  namespace: azula
spec:
  selector:
    app: azula-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azula-web
  namespace: azula
spec:
  replicas: 2
  selector:
    matchLabels:
      app: azula-web
  template:
    metadata:
      labels:
        app: azula-web
    spec:
      containers:
        - name: web
          image: azula-web:local
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: azula-web
  namespace: azula
spec:
  selector:
    app: azula-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azula
  namespace: azula
spec:
  rules:
    - host: azula.local
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: azula-api
                port:
                  number: 8080
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: azula-api
                port:
                  number: 8080
          - path: /billing
            pathType: Prefix
            backend:
              service:
                name: azula-api
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: azula-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: azula-web
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: azula-api
  namespace: azula
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: azula-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
